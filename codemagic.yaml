workflows:
  ios-unsigned-ipa:
    name: Build unsigned IPA (SAO)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        SCHEME: SAOWeb
        BUNDLE_ID: com.whale.saoweb
        APP_NAME: SAO 陷阱
        IPA_NAME: SAOWeb-unsigned.ipa
    scripts:
      - name: Verify save import logic
        script: |
          node Tests/save_import_test.js
          node Tests/save_global_test.js
      - name: Verify local HTTP server logic
        script: |
          xcrun swiftc -O Sources/LocalServer.swift Sources/Mirror.swift Tests/main.swift -o /tmp/srvcheck
          /tmp/srvcheck
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build unsigned app
        script: |
          xcodebuild \
            -project SAOWeb.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            APP_DISPLAY_NAME="$APP_NAME" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        script: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/SAOWeb.app out/Payload/
          cd out
          zip -qry "$IPA_NAME" Payload
          ls -lh "$IPA_NAME"
    artifacts:
      - out/*.ipa

