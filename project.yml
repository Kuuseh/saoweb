name: SAOWeb
options:
  bundleIdPrefix: com.whale
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

targets:
  SAOWeb:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
      - path: Resources/save_import.js
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.whale.saoweb
        PRODUCT_NAME: SAOWeb
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        APP_DISPLAY_NAME: "SAO 陷阱"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"

schemes:
  SAOWeb:
    build:
      targets:
        SAOWeb: all
    run:
      config: Release
