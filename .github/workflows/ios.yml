name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project SAOWeb.xcodeproj \
            -scheme SAOWeb \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/SAOWeb.app out/Payload/
          cd out
          zip -qry SAOWeb-unsigned.ipa Payload
          ls -lh SAOWeb-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SAOWeb-unsigned-ipa
          path: out/SAOWeb-unsigned.ipa
          if-no-files-found: error
